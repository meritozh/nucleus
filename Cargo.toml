[workspace]
resolver = "2"
members = [
    "crates/cordis-core",
    "crates/cordis-loader",
    "crates/cordis-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
cordis-core = { path = "crates/cordis-core" }
cordis-loader = { path = "crates/cordis-loader" }
cordis-wasm = { path = "crates/cordis-wasm" }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
async-trait = "0.1"
thiserror = "2"
notify = "8"
futures = "0.3"
tracing = "0.1"
wasmtime = "47"

[profile.dev]
opt-level = 0
debug = 1
